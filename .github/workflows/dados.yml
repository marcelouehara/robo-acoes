name: Atualizar dados (B3 + CVM)

on:
  schedule:
    - cron: '30 0 * * 2-6'   # 21h30 de Brasília, seg a sex (depois do fechamento da B3)
    - cron: '0 11 * * 2-6'   # 08h00 de Brasília, nova tentativa antes do robô das 12h05
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preços (B3 COTAHIST)
        run: python -I job/precos.py
      - name: Fundamentos (CVM)
        run: python -I job/fundamentos.py
      - name: Gravar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then echo "sem mudança"; exit 0; fi
          git commit -m "dados: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
